<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="generate()">generate password</button>
    <script>
        function generate(){
            var passwordList="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$&", password=[]1
            for(i=1;i<=6;i++){
                var randomNumber=Math.floor(Math.random()*passwordList.length)
                var randomCharacter=passwordList.charAt(randomNumber)
                password.push(randomCharacter)
            }
            password=password.join("")
            console.log(password)
        }
    </script>
</body>
</html>
